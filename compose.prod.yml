services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./config:/config:ro
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/app?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    # Uncomment for health check
    # healthcheck:
    #   test: ["CMD", "/app", "healthcheck"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 5s

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
